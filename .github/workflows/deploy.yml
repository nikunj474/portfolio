name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify the export produced every route
        run: |
          set -e
          for page in index about education skills experience portfolio contact; do
            path="out/$page/index.html"
            [ "$page" = index ] && path="out/index.html"
            test -f "$path" || { echo "missing: $path"; exit 1; }
            echo "ok: $path"
          done
          test -f out/CNAME || { echo "CNAME missing: the custom domain would drop"; exit 1; }
          test -f out/.nojekyll || { echo ".nojekyll missing: Pages would ignore _next/"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
