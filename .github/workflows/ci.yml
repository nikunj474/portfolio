name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the generated icon set is current
        run: |
          npm run icons
          git diff --exit-code lib/tech-icons.ts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
